definition_version: "1.1"
snowpark:
  project_name: "my_snowpark_project"
  stage_name: "dev_deployment"
  src: "app/"

  # Add default packages for all objects (if your template supports it)
  packages:
    - snowflake-snowpark-python

  functions:
    - name: hello_function
      handler: "functions.hello_function"
      signature:
        - name: "name"
          type: "string"
      returns: string
      runtime: "3.10"           # <-- scalar, not {version: ...}

  procedures:
    - name: hello_procedure
      handler: "procedures.hello_procedure"
      signature:
        - name: "name"
          type: "string"
      returns: string
      runtime: "3.10"           # <-- scalar

    - name: test_procedure
      handler: "procedures.test_procedure"
      signature: []             # no args -> [] (not "")
      returns: string
      runtime: "3.10"           # <-- scalar

    - name: test_procedure_two
      handler: "procedures.test_procedure_two"
      signature: []             # no args -> [] (not "")
      returns: string
      runtime: "3.10"           # <-- scalar
