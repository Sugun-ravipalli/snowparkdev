name: Deply snowpark apps

#controls when the action will run
on:
  push:
    branches:
      - dev
  #allows manual triggering of the workflow from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: Sugun-ravipalli/snowparkdev
          #path:dev
          ref: dev

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install python packages
        run: pip install -r requirements.txt

      # ⬇️ Create the private key on the runner
      - name: Prepare Snowflake private key
        run: |
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.SNOWFLAKE_PRIVATE_KEY_P8_DEV }}" > ~/.ssh/sf_key_dev.p8
          chmod 600 ~/.ssh/sf_key_dev.p8

      - name: Configure SnowCLI connection (CI)
        env:
          SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT_DEV }}
          SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER_DEV }}
          SNOWFLAKE_ROLE:      ${{ secrets.SNOWFLAKE_ROLE_DEV }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE_DEV }}
          SNOWFLAKE_DATABASE:  ${{ secrets.SNOWFLAKE_DATABASE_DEV }}
          SNOWFLAKE_SCHEMA:    ${{ secrets.SNOWFLAKE_SCHEMA_DEV }}
        run: |
          mkdir -p ~/.snowflake
          umask 077                                   # ensure new files are 600 by default
          cat > ~/.snowflake/config.toml <<EOF
          [connections.ci]
          account = "${SNOWFLAKE_ACCOUNT}"
          user = "${SNOWFLAKE_USER}"
          role = "${SNOWFLAKE_ROLE}"
          warehouse = "${SNOWFLAKE_WAREHOUSE}"
          database = "${SNOWFLAKE_DATABASE}"
          schema = "${SNOWFLAKE_SCHEMA}"
          private_key_path = "/home/runner/.ssh/rsa_key_dev.p8"

          [options]
          default_connection = "ci"
          EOF
              # belt and suspenders
              chmod 600 ~/.snowflake/config.toml

      - name: Deploy Snowpark app
        working-directory: first_snowpark_project
        env:
          SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT_DEV }}
          SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER_DEV }}
          SNOWFLAKE_ROLE:      ${{ secrets.SNOWFLAKE_ROLE_DEV }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE_DEV }}
          SNOWFLAKE_DATABASE:  ${{ secrets.SNOWFLAKE_DATABASE_DEV }}
          SNOWFLAKE_SCHEMA:    ${{ secrets.SNOWFLAKE_SCHEMA_DEV }}
        run: |
          snow snowpark build
          snow snowpark deploy --replace --temporary-connection \
            --account   "$SNOWFLAKE_ACCOUNT" \
            --user      "$SNOWFLAKE_USER" \
            --role      "$SNOWFLAKE_ROLE" \
            --warehouse "$SNOWFLAKE_WAREHOUSE" \
            --database  "$SNOWFLAKE_DATABASE" \
            --schema    "$SNOWFLAKE_SCHEMA" \
            --private-key-path ~/.ssh/rsa_key_dev.p8

